name: build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Gradle runs on the JDK named in PUBGApp/gradle/gradle-daemon-jvm.properties (25).
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6

      - name: Skills mirror is in sync
        run: sh scripts/sync-ai-skills.sh --check

      - name: Policy scripts behave as documented
        run: sh scripts/tests/policy-test.sh

      - name: Java style checker behaves as documented
        run: sh scripts/tests/java-style-test.sh

      - name: Build, unit tests and lint
        working-directory: PUBGApp
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug --console=plain

      - name: Keep the lint report when the build fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: PUBGApp/app/build/reports/
          if-no-files-found: ignore
