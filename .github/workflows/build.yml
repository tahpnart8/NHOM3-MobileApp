name: build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The whole history, so the step below can diff against the base of the pull request.
          fetch-depth: 0

      # A pull request that touches no file under PUBGApp/ cannot change the build, so the steps that need a
      # JDK and Gradle are skipped for it. The job itself still runs and still reports the "build" context
      # that the main-checks ruleset requires; skipping the workflow instead would leave the check pending
      # for ever and the pull request unmergeable.
      - name: Does this change app code
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "app=yes" >>"$GITHUB_OUTPUT"
            echo "not a pull request: building everything."
            exit 0
          fi
          if git diff --name-only "$BASE_SHA" HEAD -- PUBGApp/ | grep -q .; then
            echo "app=yes" >>"$GITHUB_OUTPUT"
            echo "app code changed: building everything."
          else
            echo "app=no" >>"$GITHUB_OUTPUT"
            echo "documents only: skipping the JDK, Gradle and the Android build."
          fi

      - name: Skills mirror is in sync
        run: sh workflow/scripts/sync-ai-skills.sh --check

      - name: Policy scripts behave as documented
        run: sh workflow/scripts/tests/policy-test.sh

      - name: Java style checker behaves as documented
        run: sh workflow/scripts/tests/java-style-test.sh

      # Gradle runs on the JDK named in PUBGApp/gradle/gradle-daemon-jvm.properties (25).
      - uses: actions/setup-java@v6
        if: steps.scope.outputs.app == 'yes'
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6
        if: steps.scope.outputs.app == 'yes'

      - name: Build, unit tests and lint
        if: steps.scope.outputs.app == 'yes'
        working-directory: PUBGApp
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug --console=plain

      - name: Keep the lint report when the build fails
        if: failure() && steps.scope.outputs.app == 'yes'
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: PUBGApp/app/build/reports/
          if-no-files-found: ignore
