name: Gỡ bỏ
description: Chủ ý gỡ hoặc đổi tên chức năng đã có. Chỉ leader mở.
title: "Gỡ "
labels: ["type:removal"]
body:
  - type: markdown
    attributes:
      value: |
        Chỉ leader mở issue này. Pull request nào xóa code trong PUBGApp/app/src/main phải dẫn tới nó bằng dòng `Removal-Issue: #N`.
  - type: input
    id: feature_id
    attributes:
      label: Mã tính năng
      description: Mã F-xx trong workflow/docs/product/features.md.
      placeholder: F-04
    validations:
      required: true
  - type: input
    id: plan_item
    attributes:
      label: Mã việc kế hoạch
      description: Mã trong workflow/plan/ của việc đã làm ra phần bị gỡ, và STT của chức năng bị gỡ.
      placeholder: P2-B3
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: Gỡ hoặc đổi tên cái gì
      description: Nêu chính xác lớp, file hoặc màn hình.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Vì sao, và cái gì thay thế
      description: Viết bằng tiếng Việt.
    validations:
      required: true
  - type: textarea
    id: docs
    attributes:
      label: Tài liệu cần cập nhật
      description: features.md và mọi tài liệu schema nhắc tới nó.
