name: Removal
description: Deliberate removal or rename of existing functionality. Leader only.
title: "Remove "
labels: ["type:removal"]
body:
  - type: markdown
    attributes:
      value: Only the leader opens this issue. A pull request that deletes code under PUBGApp/app/src/main must cite it with `Removal-Issue: #N`.
  - type: input
    id: feature_id
    attributes:
      label: Feature ID
      placeholder: F-04
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What is removed or renamed
      description: Exact classes, files or screens.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why, and what replaces it
    validations:
      required: true
  - type: textarea
    id: docs
    attributes:
      label: Documents to update
      description: features.md and any schema document that mentions it.
