name: Việc kỹ thuật
description: Build, thư viện, công cụ, tài liệu hoặc dọn dẹp repo
title: ""
labels: ["type:chore"]
body:
  - type: textarea
    id: context
    attributes:
      label: Bối cảnh
      description: Năm dòng cho người mới vào việc, kể cả trợ lý AI. Ứng dụng là gì, việc này nằm ở đâu trong dự án, đọc tệp nào trước, ai sở hữu phần này.
    validations:
      required: true
  - type: input
    id: plan_item
    attributes:
      label: Mã việc kế hoạch
      description: Mã trong workflow/plan/ nếu việc này nằm trong kế hoạch, ví dụ P1-04. Không có thì ghi "không có".
      placeholder: P1-04
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Làm gì và vì sao
      description: Viết bằng tiếng Việt.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Tiêu chí nghiệm thu
      description: Danh sách mà người review kiểm được.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: File được phép sửa
      description: Đường dẫn đầy đủ, mỗi dòng một file. Với issue thư viện, nêu tên thư viện, nguồn bạn tra phiên bản, và vì sao cần. File không có trong danh sách thì không được đụng.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Các bước đề nghị
      description: Danh sách đánh số, mỗi bước một việc, kèm tên tệp và tên lệnh chính xác.
    validations:
      required: true
  - type: textarea
    id: forbidden
    attributes:
      label: Cấm đụng
      description: File hoặc lớp của người khác mà việc này chỉ đọc.
  - type: input
    id: dependencies
    attributes:
      label: Phụ thuộc
      description: Issue hoặc mã kế hoạch phải xong trước.
  - type: textarea
    id: self_check
    attributes:
      label: Tự kiểm trước khi mở Pull Request
      description: Danh sách đánh dấu, mỗi dòng một lệnh kèm kết quả mong đợi. Người làm dán kết quả thật vào Pull Request (luật R1).
    validations:
      required: true
