name: Lỗi
description: Hành vi đang sai
title: "Sửa lỗi "
labels: ["type:bug"]
body:
  - type: input
    id: feature_id
    attributes:
      label: Mã tính năng
      description: Tính năng mà lỗi thuộc về, trong docs/product/features.md.
      placeholder: F-04
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Các bước tái hiện
      description: Viết bằng tiếng Việt.
      value: |
        1.
        2.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Kết quả mong đợi và kết quả thực tế
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Thiết bị và bản Android
      placeholder: Emulator Pixel 5, API 30
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Gói hoặc file được phép sửa
      description: Nơi bạn nghĩ chỗ sửa nằm ở. Mọi thứ khác nằm ngoài phạm vi.
    validations:
      required: true
